[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jdf-spec-pilot"
version = "0.1.0"
description = "Pilot toolchain for a GitHub-native JDF/XJDF specification"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
specbuild = "specbuild.cli:main"

[tool.setuptools]
packages = ["specbuild"]
