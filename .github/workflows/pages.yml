name: Preview (GitHub Pages)

# Publishes the HTML build for easy browsing.
# Enable it once in: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolchain
        run: python -m pip install -e ".[dev]"

      - name: Validate model and generated blocks
        run: specbuild check

      - name: Build all variants
        run: |
          specbuild build --variant both --out _site
          specbuild build --variant jdf --out _site/jdf
          specbuild build --variant xjdf --out _site/xjdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
