name: CI

# The first test pipeline. Runs on every pull request, on pushes to main, and
# on demand (Run workflow). It never publishes; use the Pages workflow for a
# browsable preview.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolchain
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Validate model and generated blocks
        run: specbuild check

      - name: Import the XJDF schema and reconcile against the model
        run: |
          specbuild import-xsd
          specbuild reconcile

      - name: Prove the XSD round trip
        run: specbuild roundtrip

      - name: Build the three variants
        run: |
          specbuild build --variant both --out build/both
          specbuild build --variant jdf --out build/jdf
          specbuild build --variant xjdf --out build/xjdf

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: spec-previews
          path: build/

      - name: Upload reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-report
          path: import/reconcile-report.md
